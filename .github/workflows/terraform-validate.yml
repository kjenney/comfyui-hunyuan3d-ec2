name: Terraform Validate

on:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    name: terraform validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Terraform fmt
        id: fmt
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: Terraform Init
        id: init
        run: terraform init -backend=false

      - name: Terraform Validate
        id: validate
        run: terraform validate -no-color

      - name: Post status to PR
        uses: actions/github-script@v7
        if: always()
        with:
          script: |
            const name = 'terraform validate';
            const conclusions = {
              'success': '✅ validate passed',
              'failure': '❌ validate failed',
              'cancelled': '🚫 cancelled',
              'skipped': '⏭️ skipped',
              'timed_out': '⏳ timed out',
            };
            const result =
              '${{ steps.validate.outcome }}' === 'success' &&
              '${{ steps.fmt.outcome }}' === 'success'
                ? 'success'
                : '${{ steps.validate.conclusion }}';
            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name,
              head_sha: context.sha,
              status: 'completed',
              conclusion: result === 'success' ? 'success' : 'failure',
              output: {
                title: conclusions[result] || result,
                summary:
                  '- **fmt**: ${{ steps.fmt.outcome }}\n' +
                  '- **init**: ${{ steps.init.outcome }}\n' +
                  '- **validate**: ${{ steps.validate.outcome }}',
              },
            });
